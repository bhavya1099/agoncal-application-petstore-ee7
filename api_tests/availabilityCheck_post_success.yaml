config:
  target: "{{ $processEnvironment.test_API_HOST }}"
  phases:
    - duration: 10
      arrivalRate: 20
  payload:
    path: "availabilityCheck_post_success.csv"
    fields: ["subscriberId", "complements", "addressId"]
    skipHeader: true
    delimiter: "^|^"
  plugins:
    expect: {}

scenarios:
  - name: "Test Successful Post Requests on AvailabilityCheck API"
    flow:
      - log: "Step 1: Posting a new AvailabilityCheck"
     
      - post:
          url: "/availabilityCheck"
          auth:
            mode: "default"
            basic:
              username: "{{username}}"
              password: "{{password}}"
          headers:
            content-type: "application/json"
            authorization: "Bearer {{$processEnvironment.test_AUTH_TOKEN}}"
          json:
            customer: 
              subscriberId: "{{ subscriberId }}"
            address:
              id: "{{ addressId }}"
              complement:
                complements: "{{ complements }}"

      - think: 1

      - expect:
            - statusCode: 200
            - hasProperty: "control"
            - hasProperty: "control.type"
            - equals: 
                - "control.type"
                - "S"
            - hasHeader: "content-type"
            - headerEquals: ["content-type", "application/json"]

      - log: "Step 2: Verifying details of posted AvailabilityCheck"
      
      - get:
          url: "/availabilityCheck/{{subscriberId}}"
          headers: 
            authorization: "Bearer {{$processEnvironment.test_AUTH_TOKEN}}"

      - think: 1

      - expect: 
            - statusCode: 200
            - hasProperty: "control.type"
            - equals: 
                - "control.type"
                - "S" 
            - hasHeader: "content-type"
            - headerEquals: ["content-type", "application/json"]
